[package]
name = "coreml-rs"
version = "2.0.0"
edition = "2021"
description = "Rust bindings for Core ML inference"
license-file = "LICENSE"
rust-version = "1.88"

[features]
ndarray = ["dep:ndarray"]

[dependencies]
ndarray = { version = "0.16", optional = true }
half = "2.4"
block2 = "0.6"
dispatch2 = { version = "0.3.1", features = ["block2"] }
libc = "0.2"
objc2 = "0.6.4"
objc2-core-ml = { version = "0.3.2", default-features = false, features = ["std", "block2", "MLModel", "MLModelAsset", "MLModelError", "MLModel_MLModelCompilation", "MLModelConfiguration", "MLPredictionOptions", "MLModelDescription", "MLFeatureDescription", "MLImageConstraint", "MLFeatureType", "MLFeatureValue", "MLFeatureProvider", "MLDictionaryFeatureProvider", "MLMultiArray", "MLMultiArrayConstraint", "MLMultiArrayShapeConstraint", "MLMultiArrayShapeConstraintType", "objc2-core-video", "MLArrayBatchProvider", "MLBatchProvider", "MLModel_MLState", "MLState", "MLStateConstraint", "MLModel_MLComputeDevice", "MLComputeDeviceProtocol", "MLComputePlan", "MLComputePlanCost", "MLComputePlanDeviceUsage", "MLModelStructure", "MLModelStructureProgram", "MLModelStructureProgramFunction", "MLModelStructureProgramBlock", "MLModelStructureProgramOperation", "MLModelStructureProgramNamedValueType", "MLModelStructureNeuralNetwork", "MLModelStructureNeuralNetworkLayer", "MLModelStructurePipeline"] }
objc2-core-foundation = "0.3.2"
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-metal", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVMetalTexture", "CVMetalTextureCache", "CVReturn"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice", "MTLTexture"] }
objc2-foundation = { version = "0.3.2", features = ["NSProcessInfo"] }
tempfile = "3"
thiserror = "2"

[dev-dependencies]
futures-executor = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
